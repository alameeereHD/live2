<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTRA NEON PLAYER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
    
    <style>
        :root {
            --neon-green: #00ff66;
            --neon-glow: rgba(0, 255, 102, 0.6);
            --neon-cyan: #00f3ff;
            --dark-bg: #050b14;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* حاوية الشعار + محدد القنوات (أعلى اليسار) */
        .custom-user-logo {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 35;
            display: flex;
            align-items: center;
            gap: 15px;
            pointer-events: none;
        }

        .custom-user-logo img {
            max-height: 65px;
            max-width: 180px;
            object-fit: contain;
            filter: drop-shadow(0px 0px 8px rgba(0, 255, 102, 0.4));
        }

        /* محدد القنوات - يظهر كعنصر تفاعلي */
        .channel-selector {
            pointer-events: auto;
            background: rgba(5, 11, 20, 0.85);
            border: 1px solid var(--neon-green);
            border-radius: 30px;
            padding: 8px 16px;
            color: var(--neon-green);
            font-size: 15px;
            font-weight: 600;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px var(--neon-glow);
            cursor: pointer;
            outline: none;
            max-width: 200px;
        }

        .channel-selector option {
            background: #0a1a2a;
            color: #fff;
        }

        .app-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 28px;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(5, 11, 20, 0.85) 0%, rgba(0,0,0,0.1) 25%, rgba(0,0,0,0.1) 75%, rgba(5, 11, 20, 0.95) 100%);
            transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), background 0.4s ease;
            pointer-events: none;
        }

        .app-center-controls, .app-bottom-bar {
            pointer-events: auto;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .app-player-container.hide-ui .app-overlay {
            opacity: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 100%);
        }

        .app-player-container.hide-ui .app-bottom-bar { transform: translateY(20px); opacity: 0; }
        .app-player-container.hide-ui .app-center-controls { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }

        .app-center-controls {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 45px;
            z-index: 15;
        }

        .btn-center {
            background: rgba(5, 11, 20, 0.7);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px var(--neon-glow);
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
        }
        .btn-center:active { transform: scale(0.9); background: var(--neon-green); color: #000; }

        .btn-center.main-trigger {
            width: 84px;
            height: 84px;
            font-size: 34px;
            background: var(--neon-green);
            color: #050b14;
            border: none;
            box-shadow: 0 0 25px var(--neon-green), 0 0 50px var(--neon-glow);
        }

        .btn-center.main-trigger:active {
            transform: scale(0.92);
            box-shadow: 0 0 15px var(--neon-green);
        }

        .app-bottom-bar {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 15;
            position: relative;
        }

        .app-timeline-container {
            width: 100%;
            height: 12px;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
        }

        .app-timeline-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            position: relative;
        }

        .app-timeline-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green));
            border-radius: 4px;
            position: relative;
            box-shadow: 0 0 10px var(--neon-green);
        }

        .app-timeline-progress::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            background: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--neon-green);
        }

        .app-controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-time-text {
            font-size: 14px;
            font-weight: 700;
            direction: ltr;
            color: var(--neon-green);
            text-shadow: 0 0 8px var(--neon-glow);
        }

        .app-right-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .btn-action-icon {
            background: rgba(5, 11, 20, 0.8);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
        }
        .btn-action-icon:active { transform: scale(0.9); background: var(--neon-green); color: #000; }
        .btn-speed { font-weight: 800; font-size: 13px; }

        .quality-popup-menu {
            position: absolute;
            bottom: 55px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(5, 11, 20, 0.95);
            border: 1px solid var(--neon-green);
            border-radius: 12px;
            padding: 6px 0;
            min-width: 110px;
            display: none;
            flex-direction: column;
            box-shadow: 0 0 20px var(--neon-glow);
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .quality-popup-menu button {
            background: transparent;
            border: none;
            color: #fff;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, color 0.2s;
        }

        .quality-popup-menu button:hover, .quality-popup-menu button.active {
            background: rgba(0, 255, 102, 0.2);
            color: var(--neon-green);
            font-weight: 800;
        }
    </style>
</head>
<body>

<div class="app-player-container" id="appPlayer">
    
    <!-- الشعار + محدد القنوات -->
    <div class="custom-user-logo">
        <img src="YOUR_LOGO_IMAGE_URL_HERE" alt="Logo">
        <select class="channel-selector" id="channelSelector">
            <!-- سيتم ملؤها بواسطة JavaScript -->
        </select>
    </div>

    <video id="appVideo" preload="metadata" autoplay playsinline crossorigin="anonymous"></video>

    <div class="app-overlay">
        <div></div>

        <div class="app-center-controls">
            <button class="btn-center" id="btnRewind" title="تأخير 10 ثواني"><i class="fa-solid fa-backward"></i></button>
            <button class="btn-center main-trigger" id="btnPlay" title="تشغيل/إيقاف"><i class="fa-solid fa-pause"></i></button>
            <button class="btn-center" id="btnForward" title="تقديم 10 ثواني"><i class="fa-solid fa-forward"></i></button>
        </div>

        <div class="app-bottom-bar">
            <div class="app-timeline-container" id="timelineArea">
                <div class="app-timeline-bg">
                    <div class="app-timeline-progress" id="timelineProgress"></div>
                </div>
            </div>

            <div class="app-controls-row">
                <div class="app-time-text" id="appTimeText">00:00 / 00:00</div>

                <div class="app-right-actions">
                    <div class="quality-popup-menu" id="qualityMenu"></div>

                    <button class="btn-action-icon" id="btnMute"><i class="fa-solid fa-volume-high"></i></button>
                    <button class="btn-action-icon btn-speed" id="btnSpeed">1x</button>
                    <button class="btn-action-icon" id="btnQuality" title="الجودة والإعدادات"><i class="fa-solid fa-sliders"></i></button>
                    <button class="btn-action-icon" id="btnPip" title="صورة داخل صورة"><i class="fa-solid fa-images"></i></button>
                    <button class="btn-action-icon" id="btnLock" title="قفل الشاشة عن اللمس والخطأ"><i class="fa-solid fa-lock-open"></i></button>
                    <button class="btn-action-icon" id="btnFullscreen"><i class="fa-solid fa-expand"></i></button>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    // =============== قائمة القنوات (الروابط السبع) ===============
    const channels = [
        { name: 'قناة 1 (918454578001)', url: 'https://alyaassta.hsinnzaer5.workers.dev/?stream=http%3A%2F%2Fre.new-redirect.online%2Flive%2F918454578001%2Findex.m3u8%3Ft%3DFPttU_ROHL_HeLMGBJ6-Ug%26e%3D1788854234' },
        { name: 'قناة 2 (69854211)', url: 'https://alyaassta.hsinnzaer5.workers.dev/?stream=http%3A%2F%2Fre.new-redirect.online%2Flive%2F69854211%2Findex.m3u8%3Ft%3DiZJC_VQkE76MZja1Obd1Sg%26e%3D1788855112' },
        { name: 'قناة 3 (645587700)', url: 'https://alyaassta.hsinnzaer5.workers.dev/?stream=http%3A%2F%2Fre.new-redirect.online%2Flive%2F645587700%2Findex.m3u8%3Ft%3D2oy-DAvS3sX6wBLRn8J1aA%26e%3D1788855255' },
        { name: 'قناة 4 (9787488847)', url: 'https://alyaassta.hsinnzaer5.workers.dev/?stream=http%3A%2F%2Fre.new-redirect.online%2Flive%2F9787488847%2Findex.m3u8%3Ft%3DLQ9QhPvUsySuJgEdBurekA%26e%3D1788855258' },
        { name: 'قناة 5 (610303030)', url: 'https://alyaassta.hsinnzaer5.workers.dev/?stream=http%3A%2F%2Fre.new-redirect.online%2Flive%2F610303030%2Findex.m3u8%3Ft%3DzWQZtBl39i4dXh1aq7jlBg%26e%3D1788855261' },
        { name: 'قناة 6 (1515000000)', url: 'https://alyaassta.hsinnzaer5.workers.dev/?stream=http%3A%2F%2Fre.new-redirect.online%2Flive%2F1515000000%2Findex.m3u8%3Ft%3DISWnl-rMzbplbLrpx12Ikw%26e%3D1788855263' },
        { name: 'قناة 7 (33523510)', url: 'https://alyaassta.hsinnzaer5.workers.dev/?stream=http%3A%2F%2Fre.new-redirect.online%2Flive%2F33523510%2Findex.m3u8%3Ft%3Dt_DXjuAGStgcHMM2W9tuww%26e%3D1788855267' }
    ];

    // =============== عناصر DOM ===============
    const video = document.getElementById('appVideo');
    const playerContainer = document.getElementById('appPlayer');
    const btnPlay = document.getElementById('btnPlay');
    const playIcon = btnPlay.querySelector('i');
    const btnMute = document.getElementById('btnMute');
    const volumeIcon = btnMute.querySelector('i');
    const btnFullscreen = document.getElementById('btnFullscreen');
    const timelineProgress = document.getElementById('timelineProgress');
    const timelineArea = document.getElementById('timelineArea');
    const btnSpeed = document.getElementById('btnSpeed');
    const appTimeText = document.getElementById('appTimeText');
    const btnPip = document.getElementById('btnPip');
    const btnLock = document.getElementById('btnLock');
    const btnQuality = document.getElementById('btnQuality');
    const qualityMenu = document.getElementById('qualityMenu');
    const channelSelector = document.getElementById('channelSelector');

    // تعبئة الـ select بخيارات القنوات
    channels.forEach((ch, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = ch.name;
        channelSelector.appendChild(opt);
    });

    let isLocked = false;
    let dashPlayer = null;
    let hlsPlayer = null;
    let mpegtsPlayer = null;

    // =============== دوال المشغل ===============
    function destroyAllPlayers() {
        if (dashPlayer) {
            dashPlayer.destroy();
            dashPlayer = null;
        }
        if (hlsPlayer) {
            hlsPlayer.destroy();
            hlsPlayer = null;
        }
        if (mpegtsPlayer) {
            mpegtsPlayer.destroy();
            mpegtsPlayer = null;
        }
        // إلغاء أي مستمعين قديمين للـ video (لتفادي التكرار)
        video.removeEventListener('loadedmetadata', startAutoplayWithAudio);
        video.removeEventListener('loadedmetadata', setupDashQualities);
    }

    function getDrmConfiguration(url) {
        let cleanUrl = url.split('|')[0];
        let protectionData = null;
        if (url.includes('|')) {
            let parts = url.split('|');
            let drmParam = parts[1];
            if (drmParam.startsWith('drmKey=')) {
                let keyAndLicense = drmParam.replace('drmKey=', '');
                let keyParts = keyAndLicense.split(':');
                if (keyParts.length === 2) {
                    protectionData = {
                        "org.w3.clearkey": { "clearkeys": { [keyParts[0]]: keyParts[1] } }
                    };
                }
            }
        }
        return { videoUrl: cleanUrl, protectionData: protectionData };
    }

    function initializeSmartPlayer(rawUrl) {
        destroyAllPlayers();
        video.pause();
        video.removeAttribute('src');
        video.load();

        const config = getDrmConfiguration(rawUrl);
        const cleanUrl = config.videoUrl;
        const lowercaseUrl = cleanUrl.toLowerCase();

        // DASH
        if (lowercaseUrl.includes('.mpd')) {
            dashPlayer = dashjs.MediaPlayer().create();
            dashPlayer.initialize(video, cleanUrl, true);
            if (config.protectionData) {
                dashPlayer.setProtectionData(config.protectionData);
            }
            dashPlayer.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, function() {
                startAutoplayWithAudio();
                setTimeout(setupDashQualities, 1500);
            });
        }
        // HLS
        else if (lowercaseUrl.includes('.m3u8')) {
            if (Hls.isSupported()) {
                hlsPlayer = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true
                });
                hlsPlayer.loadSource(cleanUrl);
                hlsPlayer.attachMedia(video);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
                    startAutoplayWithAudio();
                    setupHlsQualities();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = cleanUrl;
                video.addEventListener('loadedmetadata', function() {
                    startAutoplayWithAudio();
                });
            }
        }
        // MPEG-TS / FLV
        else if (lowercaseUrl.includes('.ts') || lowercaseUrl.includes('.flv') || (typeof mpegts !== 'undefined' && mpegts.JSPlayer && mpegts.JSPlayer.isSupported())) {
            if (typeof mpegts !== 'undefined' && mpegts.JSPlayer && mpegts.JSPlayer.isSupported()) {
                let type = lowercaseUrl.includes('.flv') ? 'flv' : 'mse';
                mpegtsPlayer = mpegts.createPlayer({
                    type: type,
                    isLive: true,
                    url: cleanUrl
                });
                mpegtsPlayer.attachMediaElement(video);
                mpegtsPlayer.load();
                mpegtsPlayer.play().then(() => {
                    startAutoplayWithAudio();
                }).catch(err => {
                    console.log("Mpegts autoplay deferred", err);
                });
                qualityMenu.innerHTML = '<button class="active">جودة تلقائية</button>';
            } else {
                fallbackToDefault(cleanUrl);
            }
        }
        // باقي الصيغ (MP4, WebM, إلخ)
        else {
            fallbackToDefault(cleanUrl);
        }
    }

    function fallbackToDefault(url) {
        video.src = url;
        video.load();
        video.addEventListener('loadedmetadata', function() {
            startAutoplayWithAudio();
            qualityMenu.innerHTML = '<button class="active">جودة تلقائية</button>';
        });
    }

    // جودات DASH
    function setupDashQualities() {
        let bitrates = dashPlayer.getBitrateInfoListFor('video');
        if (!bitrates || bitrates.length <= 1) {
            qualityMenu.innerHTML = '<button class="active">جودة تلقائية</button>';
            return;
        }
        qualityMenu.innerHTML = '<button class="active" id="q-auto">تلقائي</button>';
        bitrates.sort((a, b) => b.height - a.height);
        let seenHeights = new Set();
        bitrates.forEach((info) => {
            if (!seenHeights.has(info.height) && info.height > 0) {
                seenHeights.add(info.height);
                let btn = document.createElement('button');
                btn.innerText = info.height + 'p';
                btn.onclick = () => {
                    dashPlayer.setQualityFor('video', info.index);
                    dashPlayer.setAutoSwitchQualityFor('video', false);
                    updateQualityActiveBtn(btn);
                };
                qualityMenu.appendChild(btn);
            }
        });
        document.getElementById('q-auto').onclick = () => {
            dashPlayer.setAutoSwitchQualityFor('video', true);
            updateQualityActiveBtn(document.getElementById('q-auto'));
        };
    }

    // جودات HLS
    function setupHlsQualities() {
        let levels = hlsPlayer.levels;
        if (!levels || levels.length <= 1) {
            qualityMenu.innerHTML = '<button class="active">جودة تلقائية</button>';
            return;
        }
        qualityMenu.innerHTML = '<button class="active" id="q-auto">تلقائي</button>';
        levels.forEach((level, index) => {
            let btn = document.createElement('button');
            btn.innerText = (level.height ? level.height : 'جودة ' + index) + 'p';
            btn.onclick = () => {
                hlsPlayer.currentLevel = index;
                updateQualityActiveBtn(btn);
            };
            qualityMenu.appendChild(btn);
        });
        document.getElementById('q-auto').onclick = () => {
            hlsPlayer.currentLevel = -1;
            updateQualityActiveBtn(document.getElementById('q-auto'));
        };
    }

    function updateQualityActiveBtn(activeBtn) {
        document.querySelectorAll('.quality-popup-menu button').forEach(b => b.classList.remove('active'));
        activeBtn.classList.add('active');
        qualityMenu.style.display = 'none';
    }

    // تشغيل تلقائي مع إلغاء كتم الصوت
    function startAutoplayWithAudio() {
        video.muted = false;
        video.play().catch(err => {
            video.muted = true;
            volumeIcon.className = 'fa-solid fa-volume-xmark';
            video.play();
            const enableAudioOnTouch = () => {
                video.muted = false;
                volumeIcon.className = 'fa-solid fa-volume-high';
                document.removeEventListener('touchstart', enableAudioOnTouch);
                document.removeEventListener('click', enableAudioOnTouch);
            };
            document.addEventListener('touchstart', enableAudioOnTouch);
            document.addEventListener('click', enableAudioOnTouch);
        });
        // إعادة تعيين أيقونة التشغيل
        playIcon.className = 'fa-solid fa-pause';
        // إعادة تعيين سرعة التشغيل إلى 1x
        video.playbackRate = 1.0;
        btnSpeed.innerText = '1x';
        // إعادة ضبط التوقيت
        timelineProgress.style.width = '0%';
        appTimeText.innerText = '00:00 / 00:00';
    }

    // =============== ربط أحداث التحكم ===============
    // تشغيل القناة الأولى عند التحميل
    let currentChannelIndex = 0;
    function loadChannel(index) {
        currentChannelIndex = index;
        const url = channels[index].url;
        initializeSmartPlayer(url);
        // إخفاء قائمة الجودة عند التبديل
        qualityMenu.style.display = 'none';
        // إعادة ضبط مؤقت إخفاء الواجهة
        resetUiTimeout();
    }

    // حدث تغيير القناة
    channelSelector.addEventListener('change', function() {
        loadChannel(parseInt(this.value));
    });

    // تحميل القناة الأولى افتراضياً
    loadChannel(0);

    // التحكم في التشغيل
    btnPlay.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });

    video.addEventListener('click', () => {
        if (playerContainer.classList.contains('hide-ui')) {
            resetUiTimeout();
        } else {
            if(!isLocked) togglePlay();
        }
    });

    function togglePlay() {
        if (video.paused) {
            video.play();
            playIcon.className = 'fa-solid fa-pause';
        } else {
            video.pause();
            playIcon.className = 'fa-solid fa-play';
        }
        resetUiTimeout();
    }

    // تحديث التوقيت
    video.addEventListener('timeupdate', () => {
        if(video.duration && !isNaN(video.duration) && isFinite(video.duration)) {
            const percentage = (video.currentTime / video.duration) * 100;
            timelineProgress.style.width = `${percentage}%`;
            let curM = Math.floor(video.currentTime / 60);
            let curS = Math.floor(video.currentTime % 60);
            let durM = Math.floor(video.duration / 60);
            let durS = Math.floor(video.duration % 60);
            appTimeText.innerText = `${curM < 10 ? '0'+curM : curM}:${curS < 10 ? '0'+curS : curS} / ${durM < 10 ? '0'+durM : durM}:${durS < 10 ? '0'+durS : durS}`;
        } else {
            let m = Math.floor(video.currentTime / 60);
            let s = Math.floor(video.currentTime % 60);
            appTimeText.innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s} • مباشر`;
        }
    });

    // كتم الصوت
    btnMute.addEventListener('click', (e) => {
        e.stopPropagation();
        video.muted = !video.muted;
        volumeIcon.className = video.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
        resetUiTimeout();
    });

    // تقديم / تأخير
    document.getElementById('btnForward').addEventListener('click', (e) => { e.stopPropagation(); video.currentTime += 10; resetUiTimeout(); });
    document.getElementById('btnRewind').addEventListener('click', (e) => { e.stopPropagation(); video.currentTime -= 10; resetUiTimeout(); });

    // سرعة التشغيل
    btnSpeed.addEventListener('click', (e) => {
        e.stopPropagation();
        video.playbackRate = video.playbackRate === 1.0 ? 1.5 : (video.playbackRate === 1.5 ? 2.0 : 1.0);
        btnSpeed.innerText = video.playbackRate + 'x';
        resetUiTimeout();
    });

    // قفل الشاشة
    btnLock.addEventListener('click', (e) => {
        e.stopPropagation();
        isLocked = !isLocked;
        btnLock.innerHTML = isLocked ? '<i class="fa-solid fa-lock"></i>' : '<i class="fa-solid fa-lock-open"></i>';
        const controls = document.querySelectorAll('.app-center-controls, .app-timeline-container, .btn-action-icon:not(#btnLock)');
        controls.forEach(el => {
            el.style.pointerEvents = isLocked ? 'none' : 'auto';
            el.style.opacity = isLocked ? '0.15' : '1';
        });
        resetUiTimeout();
    });

    // ملء الشاشة
    btnFullscreen.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!document.fullscreenElement) {
            playerContainer.requestFullscreen().then(() => {
                if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
            }).catch(err => console.log(err));
        } else {
            document.exitFullscreen();
            if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
        }
        resetUiTimeout();
    });

    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement && screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    });

    // Picture-in-Picture
    btnPip.addEventListener('click', (e) => {
        e.stopPropagation();
        if (video !== document.pictureInPictureElement) video.requestPictureInPicture();
        else document.exitPictureInPicture();
        resetUiTimeout();
    });

    // شريط التقدم
    timelineArea.addEventListener('click', (e) => {
        e.stopPropagation();
        if(!isLocked && video.duration && !isNaN(video.duration) && isFinite(video.duration)) {
            const rect = timelineArea.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percentage = clickX / rect.width;
            video.currentTime = percentage * video.duration;
        }
        resetUiTimeout();
    });

    // زر الجودة
    btnQuality.addEventListener('click', (e) => {
        e.stopPropagation();
        qualityMenu.style.display = qualityMenu.style.display === 'flex' ? 'none' : 'flex';
        resetUiTimeout();
    });

    // إخفاء الواجهة تلقائياً
    let uiTimeout;
    function resetUiTimeout() {
        playerContainer.classList.remove('hide-ui');
        clearTimeout(uiTimeout);
        uiTimeout = setTimeout(() => {
            if (!video.paused && !isLocked) {
                playerContainer.classList.add('hide-ui');
                qualityMenu.style.display = 'none';
            }
        }, 3500);
    }

    playerContainer.addEventListener('mousemove', resetUiTimeout);
    playerContainer.addEventListener('touchstart', resetUiTimeout);
    resetUiTimeout();
</script>

</body>
</html>
