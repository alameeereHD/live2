<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربة بث ثمانية الأولى</title>
    <!-- استدعاء مكتبة HLS.js لتشغيل روابط m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .video-container {
            width: 90%;
            max-width: 800px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        h2 {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <h2>تجربة تشغيل البث المباشر</h2>

    <div class="video-container">
        <video id="video" controls autoplay muted></video>
    </div>

    <script>
        const video = document.getElementById('video');
        // نضع الرابط الأصلي المباشر (وليس الرابط الموجه)
        const streamUrl = 'https://ahm79.store/live/0545580310/7337741654/746713.m3u8';

        if (Hls.isSupported()) {
            const hls = new Hls({
                // تفعيل التوجيه التلقائي واستلام التوكن
                xhrSetup: function (xhr, url) {
                    xhr.withCredentials = false;
                }
            });
            
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function () {
                video.play();
            });

            hls.on(Hls.Events.ERROR, function (event, data) {
                console.error("HLS Error:", data);
            });
        } 
        // لدعم متصفح Safari على آيفون (الذي يدعم HLS بشكل أصل)
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', function () {
                video.play();
            });
        }
    </script>
</body>
</html>
