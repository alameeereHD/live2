<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الاميريTv - ULTRA PLAYER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        body {
            background: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .player-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* شريط علوي (شعار نصي + محدد القنوات) */
        .top-bar {
            position: absolute;
            top: 18px;
            left: 18px;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 18px;
            pointer-events: none;
        }

        .brand-text {
            font-size: 28px;
            font-weight: 900;
            color: #00ff66;
            text-shadow: 0 0 15px #00ff66, 0 0 40px #00ff6644;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 16px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            border: 1px solid #00ff6644;
            pointer-events: none;
            white-space: nowrap;
        }

        .top-bar select {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.7);
            border: 1.5px solid #00ff66;
            border-radius: 30px;
            padding: 8px 18px;
            color: #00ff66;
            font-weight: 700;
            font-size: 15px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 12px #00ff6644;
            cursor: pointer;
            outline: none;
            min-width: 110px;
        }
        .top-bar select option {
            background: #111;
            color: #fff;
        }

        /* طبقة التحكم الخلفية */
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.9) 100%);
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .overlay.hidden {
            opacity: 0;
        }

        .center-buttons {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 40px;
            pointer-events: auto;
            z-index: 15;
        }

        .btn-circle {
            background: rgba(0,0,0,0.6);
            border: 2px solid #00ff66;
            color: #00ff66;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px #00ff6644;
            transition: 0.15s;
        }
        .btn-circle:active { transform: scale(0.92); background: #00ff66; color: #000; }

        .btn-circle.play-btn {
            width: 80px;
            height: 80px;
            font-size: 34px;
            background: #00ff66;
            color: #000;
            border: none;
            box-shadow: 0 0 30px #00ff66, 0 0 60px #00ff6644;
        }

        .bottom-bar {
            display: flex;
            flex-direction: column;
            gap: 14px;
            pointer-events: auto;
            z-index: 15;
        }

        .timeline {
            width: 100%;
            height: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .timeline-bg {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.25);
            border-radius: 4px;
            position: relative;
        }
        .timeline-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #00f3ff, #00ff66);
            border-radius: 4px;
            box-shadow: 0 0 12px #00ff66;
            position: relative;
        }
        .timeline-progress::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            background: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 16px #00ff66;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time-display {
            color: #00ff66;
            font-weight: 700;
            font-size: 14px;
            text-shadow: 0 0 10px #00ff66aa;
            direction: ltr;
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
            position: relative;
            flex-wrap: wrap;
        }

        .btn-icon {
            background: rgba(0,0,0,0.6);
            border: 1px solid #00ff66;
            color: #00ff66;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 8px #00ff6633;
            transition: 0.15s;
        }
        .btn-icon:active { background: #00ff66; color: #000; transform: scale(0.92); }
        .btn-speed { font-size: 13px; font-weight: 800; }

        .quality-dropdown {
            position: absolute;
            bottom: 52px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.92);
            border: 1px solid #00ff66;
            border-radius: 12px;
            padding: 6px 0;
            min-width: 110px;
            display: none;
            flex-direction: column;
            box-shadow: 0 0 24px #00ff66aa;
            backdrop-filter: blur(10px);
            z-index: 50;
        }
        .quality-dropdown button {
            background: transparent;
            border: none;
            color: #fff;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .quality-dropdown button:hover,
        .quality-dropdown button.active {
            background: #00ff6633;
            color: #00ff66;
        }

        /* رسالة الحالة */
        .status-msg {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 14px;
            border: 1px solid #00ff66;
            backdrop-filter: blur(4px);
            z-index: 20;
            text-align: center;
            pointer-events: none;
            white-space: nowrap;
        }
        .status-msg.error { border-color: #ff4444; color: #ff4444; }
        .status-msg.loading { border-color: #ffaa00; color: #ffaa00; }

        /* Spinner تحميل */
        .spinner {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #00ff66;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            z-index: 5;
        }
        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

        /* عند القفل */
        .locked .center-buttons,
        .locked .bottom-bar {
            opacity: 0.2;
            pointer-events: none;
        }
        .locked .btn-icon#btnLock {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

<div class="player-wrapper" id="playerWrapper">
    <!-- شريط أعلى -->
    <div class="top-bar">
        <span class="brand-text">⚡ الاميريTv</span>
        <select id="channelSelect"></select>
    </div>

    <!-- عنصر الفيديو -->
    <video id="videoPlayer" playsinline crossorigin="anonymous"></video>

    <!-- Spinner -->
    <div class="spinner" id="loadingSpinner"></div>

    <!-- رسالة الحالة -->
    <div class="status-msg" id="statusMsg">⏳ جارٍ التحميل...</div>

    <!-- طبقة التحكم -->
    <div class="overlay" id="overlay">
        <div></div>

        <div class="center-buttons">
            <button class="btn-circle" id="btnRewind"><i class="fas fa-backward"></i></button>
            <button class="btn-circle play-btn" id="btnPlay"><i class="fas fa-pause"></i></button>
            <button class="btn-circle" id="btnForward"><i class="fas fa-forward"></i></button>
        </div>

        <div class="bottom-bar">
            <div class="timeline" id="timelineArea">
                <div class="timeline-bg">
                    <div class="timeline-progress" id="timelineProgress"></div>
                </div>
            </div>

            <div class="controls-row">
                <span class="time-display" id="timeText">00:00 / 00:00</span>
                <div class="actions">
                    <div class="quality-dropdown" id="qualityMenu"></div>

                    <button class="btn-icon" id="btnMute"><i class="fas fa-volume-high"></i></button>
                    <button class="btn-icon btn-speed" id="btnSpeed">1x</button>
                    <button class="btn-icon" id="btnQuality"><i class="fas fa-sliders"></i></button>
                    <button class="btn-icon" id="btnPip"><i class="fas fa-images"></i></button>
                    <button class="btn-icon" id="btnLock"><i class="fas fa-lock-open"></i></button>
                    <button class="btn-icon" id="btnFullscreen"><i class="fas fa-expand"></i></button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ===================== قائمة القنوات (beIN 1 إلى beIN 7) =====================
    const channels = [
        { name: 'beIN 1', url: 'https://alyaassta.hsinnzaer5.workers.dev/?stream=http%3A%2F%2Fre.new-redirect.online%2Flive%2F918454578001%2Findex.m3u8%3Ft%3DFPttU_ROHL_HeLMGBJ6-Ug%26e%3D1788854234' },
        { name: 'beIN 2', url: 'https://alyaassta.hsinnzaer5.workers.dev/?stream=http%3A%2F%2Fre.new-redirect.online%2Flive%2F69854211%2Findex.m3u8%3Ft%3DiZJC_VQkE76MZja1Obd1Sg%26e%3D1788855112' },
        { name: 'beIN 3', url: 'https://alyaassta.hsinnzaer5.workers.dev/?stream=http%3A%2F%2Fre.new-redirect.online%2Flive%2F645587700%2Findex.m3u8%3Ft%3D2oy-DAvS3sX6wBLRn8J1aA%26e%3D1788855255' },
        { name: 'beIN 4', url: 'https://alyaassta.hsinnzaer5.workers.dev/?stream=http%3A%2F%2Fre.new-redirect.online%2Flive%2F9787488847%2Findex.m3u8%3Ft%3DLQ9QhPvUsySuJgEdBurekA%26e%3D1788855258' },
        { name: 'beIN 5', url: 'https://alyaassta.hsinnzaer5.workers.dev/?stream=http%3A%2F%2Fre.new-redirect.online%2Flive%2F610303030%2Findex.m3u8%3Ft%3DzWQZtBl39i4dXh1aq7jlBg%26e%3D1788855261' },
        { name: 'beIN 6', url: 'https://alyaassta.hsinnzaer5.workers.dev/?stream=http%3A%2F%2Fre.new-redirect.online%2Flive%2F1515000000%2Findex.m3u8%3Ft%3DISWnl-rMzbplbLrpx12Ikw%26e%3D1788855263' },
        { name: 'beIN 7', url: 'https://alyaassta.hsinnzaer5.workers.dev/?stream=http%3A%2F%2Fre.new-redirect.online%2Flive%2F33523510%2Findex.m3u8%3Ft%3Dt_DXjuAGStgcHMM2W9tuww%26e%3D1788855267' }
    ];

    // ===================== متغيرات =====================
    const video = document.getElementById('videoPlayer');
    const wrapper = document.getElementById('playerWrapper');
    const overlay = document.getElementById('overlay');
    const statusMsg = document.getElementById('statusMsg');
    const spinner = document.getElementById('loadingSpinner');
    const channelSelect = document.getElementById('channelSelect');
    const btnPlay = document.getElementById('btnPlay');
    const playIcon = btnPlay.querySelector('i');
    const btnMute = document.getElementById('btnMute');
    const volumeIcon = btnMute.querySelector('i');
    const btnFullscreen = document.getElementById('btnFullscreen');
    const timelineProgress = document.getElementById('timelineProgress');
    const timelineArea = document.getElementById('timelineArea');
    const btnSpeed = document.getElementById('btnSpeed');
    const timeText = document.getElementById('timeText');
    const btnPip = document.getElementById('btnPip');
    const btnLock = document.getElementById('btnLock');
    const btnQuality = document.getElementById('btnQuality');
    const qualityMenu = document.getElementById('qualityMenu');
    const btnRewind = document.getElementById('btnRewind');
    const btnForward = document.getElementById('btnForward');

    let isLocked = false;
    let dashPlayer = null, hlsPlayer = null, mpegtsPlayer = null;
    let uiTimeout = null;

    // تعبئة محدد القنوات
    channels.forEach((ch, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = ch.name;
        channelSelect.appendChild(opt);
    });

    // ===================== دوال مساعدة =====================
    function setStatus(text, type = 'loading') {
        statusMsg.textContent = text;
        statusMsg.className = 'status-msg ' + type;
        if (type === 'loading') spinner.style.display = 'block';
        else spinner.style.display = 'none';
    }

    function hideUI() {
        overlay.classList.add('hidden');
    }

    function showUI() {
        overlay.classList.remove('hidden');
        clearTimeout(uiTimeout);
        uiTimeout = setTimeout(() => {
            if (!video.paused && !isLocked) hideUI();
        }, 4000);
    }

    function destroyPlayers() {
        if (dashPlayer) { dashPlayer.destroy(); dashPlayer = null; }
        if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
        if (mpegtsPlayer) { mpegtsPlayer.destroy(); mpegtsPlayer = null; }
        video.pause();
        video.removeAttribute('src');
        video.load();
        timelineProgress.style.width = '0%';
        timeText.textContent = '00:00 / 00:00';
        playIcon.className = 'fas fa-play';
        video.playbackRate = 1.0;
        btnSpeed.textContent = '1x';
        qualityMenu.style.display = 'none';
    }

    // ===================== المحرك الذكي =====================
    function loadStream(url) {
        destroyPlayers();
        setStatus('⏳ جارٍ التحميل...', 'loading');
        showUI();

        let cleanUrl = url.split('|')[0];
        let protectionData = null;
        if (url.includes('|')) {
            let parts = url.split('|');
            let drmParam = parts[1];
            if (drmParam.startsWith('drmKey=')) {
                let keyAndLicense = drmParam.replace('drmKey=', '');
                let keyParts = keyAndLicense.split(':');
                if (keyParts.length === 2) {
                    protectionData = { "org.w3.clearkey": { "clearkeys": { [keyParts[0]]: keyParts[1] } } };
                }
            }
        }

        const low = cleanUrl.toLowerCase();

        if (low.includes('.mpd')) {
            dashPlayer = dashjs.MediaPlayer().create();
            dashPlayer.initialize(video, cleanUrl, true);
            if (protectionData) dashPlayer.setProtectionData(protectionData);
            dashPlayer.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, () => {
                setStatus('✅ جاهز', '');
                video.play().catch(() => {});
                setTimeout(setupDashQualities, 1500);
            });
            dashPlayer.on(dashjs.MediaPlayer.events.ERROR, () => setStatus('❌ خطأ في البث', 'error'));
        } 
        else if (low.includes('.m3u8')) {
            if (Hls.isSupported()) {
                hlsPlayer = new Hls({ enableWorker: true, lowLatencyMode: true });
                hlsPlayer.loadSource(cleanUrl);
                hlsPlayer.attachMedia(video);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                    setStatus('✅ جاهز', '');
                    video.play().catch(() => {});
                    setupHlsQualities();
                });
                hlsPlayer.on(Hls.Events.ERROR, () => setStatus('❌ خطأ في البث', 'error'));
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = cleanUrl;
                video.addEventListener('loadedmetadata', () => {
                    setStatus('✅ جاهز', '');
                    video.play().catch(() => {});
                });
            } else {
                setStatus('❌ المتصفح لا يدعم HLS', 'error');
            }
        }
        else if (low.includes('.ts') || low.includes('.flv') || (typeof mpegts !== 'undefined' && mpegts.JSPlayer && mpegts.JSPlayer.isSupported())) {
            if (typeof mpegts !== 'undefined' && mpegts.JSPlayer && mpegts.JSPlayer.isSupported()) {
                let type = low.includes('.flv') ? 'flv' : 'mse';
                mpegtsPlayer = mpegts.createPlayer({ type, isLive: true, url: cleanUrl });
                mpegtsPlayer.attachMediaElement(video);
                mpegtsPlayer.load();
                mpegtsPlayer.play().then(() => setStatus('✅ جاهز', '')).catch(() => setStatus('⚠️ تشغيل تلقائي مقيد', ''));
                qualityMenu.innerHTML = '<button class="active">تلقائي</button>';
            } else {
                fallback(cleanUrl);
            }
        }
        else {
            fallback(cleanUrl);
        }
    }

    function fallback(url) {
        video.src = url;
        video.load();
        video.addEventListener('loadedmetadata', () => {
            setStatus('✅ جاهز', '');
            video.play().catch(() => {});
            qualityMenu.innerHTML = '<button class="active">تلقائي</button>';
        });
        video.addEventListener('error', () => setStatus('❌ فشل التحميل', 'error'));
    }

    // ===================== جودات DASH و HLS =====================
    function setupDashQualities() {
        let bitrates = dashPlayer.getBitrateInfoListFor('video');
        if (!bitrates || bitrates.length <= 1) {
            qualityMenu.innerHTML = '<button class="active">تلقائي</button>';
            return;
        }
        qualityMenu.innerHTML = '<button class="active" id="q-auto">تلقائي</button>';
        bitrates.sort((a, b) => b.height - a.height);
        let seen = new Set();
        bitrates.forEach(info => {
            if (!seen.has(info.height) && info.height > 0) {
                seen.add(info.height);
                let btn = document.createElement('button');
                btn.textContent = info.height + 'p';
                btn.onclick = () => {
                    dashPlayer.setQualityFor('video', info.index);
                    dashPlayer.setAutoSwitchQualityFor('video', false);
                    updateQualityActive(btn);
                };
                qualityMenu.appendChild(btn);
            }
        });
        document.getElementById('q-auto').onclick = () => {
            dashPlayer.setAutoSwitchQualityFor('video', true);
            updateQualityActive(document.getElementById('q-auto'));
        };
    }

    function setupHlsQualities() {
        let levels = hlsPlayer.levels;
        if (!levels || levels.length <= 1) {
            qualityMenu.innerHTML = '<button class="active">تلقائي</button>';
            return;
        }
        qualityMenu.innerHTML = '<button class="active" id="q-auto">تلقائي</button>';
        levels.forEach((level, idx) => {
            let btn = document.createElement('button');
            btn.textContent = (level.height ? level.height : 'جودة ' + idx) + 'p';
            btn.onclick = () => {
                hlsPlayer.currentLevel = idx;
                updateQualityActive(btn);
            };
            qualityMenu.appendChild(btn);
        });
        document.getElementById('q-auto').onclick = () => {
            hlsPlayer.currentLevel = -1;
            updateQualityActive(document.getElementById('q-auto'));
        };
    }

    function updateQualityActive(active) {
        document.querySelectorAll('.quality-dropdown button').forEach(b => b.classList.remove('active'));
        active.classList.add('active');
        qualityMenu.style.display = 'none';
    }

    // ===================== أحداث التحكم =====================
    let currentIndex = 0;
    function loadChannel(index) {
        currentIndex = index;
        loadStream(channels[index].url);
        qualityMenu.style.display = 'none';
        showUI();
    }

    channelSelect.addEventListener('change', function() {
        loadChannel(parseInt(this.value));
    });

    function togglePlay() {
        if (video.paused) {
            video.play().catch(() => {});
            playIcon.className = 'fas fa-pause';
        } else {
            video.pause();
            playIcon.className = 'fas fa-play';
        }
        showUI();
    }

    btnPlay.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
    video.addEventListener('click', () => {
        if (overlay.classList.contains('hidden')) showUI();
        else if (!isLocked) togglePlay();
    });

    video.addEventListener('timeupdate', () => {
        if (video.duration && isFinite(video.duration)) {
            let pct = (video.currentTime / video.duration) * 100;
            timelineProgress.style.width = pct + '%';
            let cm = Math.floor(video.currentTime/60), cs = Math.floor(video.currentTime%60);
            let dm = Math.floor(video.duration/60), ds = Math.floor(video.duration%60);
            timeText.textContent = `${String(cm).padStart(2,'0')}:${String(cs).padStart(2,'0')} / ${String(dm).padStart(2,'0')}:${String(ds).padStart(2,'0')}`;
        } else {
            let m = Math.floor(video.currentTime/60), s = Math.floor(video.currentTime%60);
            timeText.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} • مباشر`;
        }
    });

    timelineArea.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isLocked) return;
        if (video.duration && isFinite(video.duration)) {
            let rect = timelineArea.getBoundingClientRect();
            let x = (e.clientX - rect.left) / rect.width;
            video.currentTime = x * video.duration;
        }
        showUI();
    });

    btnMute.addEventListener('click', (e) => {
        e.stopPropagation();
        video.muted = !video.muted;
        volumeIcon.className = video.muted ? 'fas fa-volume-xmark' : 'fas fa-volume-high';
        showUI();
    });

    btnRewind.addEventListener('click', (e) => { e.stopPropagation(); video.currentTime -= 10; showUI(); });
    btnForward.addEventListener('click', (e) => { e.stopPropagation(); video.currentTime += 10; showUI(); });

    btnSpeed.addEventListener('click', (e) => {
        e.stopPropagation();
        let rates = [1.0, 1.5, 2.0];
        let idx = rates.indexOf(video.playbackRate);
        if (idx === -1) idx = 0;
        let next = rates[(idx + 1) % rates.length];
        video.playbackRate = next;
        btnSpeed.textContent = next + 'x';
        showUI();
    });

    btnLock.addEventListener('click', (e) => {
        e.stopPropagation();
        isLocked = !isLocked;
        btnLock.innerHTML = isLocked ? '<i class="fas fa-lock"></i>' : '<i class="fas fa-lock-open"></i>';
        wrapper.classList.toggle('locked', isLocked);
        showUI();
    });

    btnFullscreen.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!document.fullscreenElement) {
            wrapper.requestFullscreen().then(() => {
                if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
            }).catch(() => {});
        } else {
            document.exitFullscreen();
            if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
        }
        showUI();
    });
    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement && screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    });

    btnPip.addEventListener('click', (e) => {
        e.stopPropagation();
        if (video !== document.pictureInPictureElement) video.requestPictureInPicture();
        else document.exitPictureInPicture();
        showUI();
    });

    btnQuality.addEventListener('click', (e) => {
        e.stopPropagation();
        qualityMenu.style.display = qualityMenu.style.display === 'flex' ? 'none' : 'flex';
        showUI();
    });

    wrapper.addEventListener('mousemove', showUI);
    wrapper.addEventListener('touchstart', showUI);

    // بدء التشغيل على beIN 1
    loadChannel(0);
</script>
</body>
</html>
